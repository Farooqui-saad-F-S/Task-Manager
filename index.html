<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A task manager that help you maintain your task by date time and much more">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
</head>

<body>
    <main>
    <div class="container">
        <div class="head">
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
            <h1 id="head-text">Task List</h1>
        </div>
        <div id="newtask">
            <label for="taskInput">
            <input id="taskInput" type="text" placeholder="Add a task">
            </label>
            <label>
            <input type="date" placeholder="Add Date" id="date">
            </label>
            <label>
            <input type="time" placeholder="Add Time" id="time">
            </label>

            <label for="selection">
            <select id="selection">
                <option value="Study">Study</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
            </select>
            </label>

            <label for="priority">
            <select id="priority">
                <option value="Green">Low (Green)</option>
                <option value="Yellow">Medium (Yellow)</option>
                <option value="Red">High (Red)</option>
            </select>
            </label>

            <button id="push" aria-label="Add task">Add</button>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all" aria-label="Filter task">All</button>
            <button class="filter-btn" data-filter="Study" aria-label="Filter task">Study</button>
            <button class="filter-btn" data-filter="Work" aria-label="Filter task">Work</button>
            <button class="filter-btn" data-filter="Personal" aria-label="Filter task">Personal</button>
            <button class="filter-btn" data-filter="Completed" aria-label="Filter task">Completed</button>
        </div>

        <div class="prioSelect">
            <button class="priority-btn activated" data-priority="None" aria-label="priority task"></button>
            <button class="priority-btn low" data-priority="Green" aria-label="priority task"></button>
            <button class="priority-btn medium" data-priority="Yellow"  aria-label="priority task"></button>
            <button class="priority-btn high" data-priority="Red" aria-label="priority task"></button>
        </div>
        <div class="tasks">
            
        </div>
    </div>
</main>
    <script src="script.js"></script>
</body>

</html>
